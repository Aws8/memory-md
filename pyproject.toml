[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-md"
version = "0.1.0"
description = "Linter, grapher and dry-run Dreaming for Agent Memory Repo — the open memory standard for AI agents"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Aws", email = "mrawsrek@gmail.com" }]
keywords = ["agent-memory-repo", "devin", "ai-agents", "memory", "lint", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/Aws8/memory-md"
"Agent Memory Repo spec" = "https://cognition.com/agent-memory-repo"
BugTracker = "https://github.com/Aws8/memory-md/issues"

[project.scripts]
mem = "memory_md.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
